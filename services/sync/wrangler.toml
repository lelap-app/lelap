# Encrypted sync. The Worker stores sealed messages and never sees keys or plaintext.
# No routes here: deploys pass the custom domain, so forks deploy to their own.
# The databases were made with `wrangler d1 create`; forks make their own and put their IDs
# here. Deploys apply migrations/ (main: staging, v* tags: production).
name = "lelap-sync"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
send_metrics = false

# Daily upkeep (src/index.ts): drops old pairings, and groups idle for SYNC_IDLE_EXPIRY_DAYS.
# That setting is not here: deploys pass it with --var from the GitHub environment, so it is
# unset (never expire) unless a host sets it. lelap.app sets 730.
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lelap-sync"
database_id = "0561593f-a7b9-4aa8-9e99-8a125f9b0503"
migrations_dir = "migrations"

[env.staging]
name = "lelap-sync-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "lelap-sync-staging"
database_id = "b0d41aa9-d43d-446b-9022-874ba2e9527d"
migrations_dir = "migrations"
