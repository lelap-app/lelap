packages:
  - apps/*
  - packages/*
  - services/*
  - modules/*
allowBuilds:
  simple-git-hooks: false

# Supply-chain policy (see AGENTS.md). Versions must be published for 7 days before they install;
# an explicit value makes the check strict. Let an urgent fix through with
# minimumReleaseAgeExclude and a comment saying why.
minimumReleaseAge: 10080
# Fail when a new version is published with weaker provenance than earlier ones.
trustPolicy: no-downgrade
# Transitive dependencies must come from the registry, not git or tarball URLs.
blockExoticSubdeps: true
# Drops exclusions the lockfile no longer resolves, e.g. after Dependabot bumps a package.
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  # Resolved on 2026-11-16, before this policy existed; all are 7 days old by 2026-11-21.
  - '@astrojs/internal-helpers@0.13.2'
  - '@astrojs/markdown-satteri@0.4.10'
  - '@astrojs/runtime@0.1.1'
  - '@astrojs/vite-plugin-astro@0.1.3'
  - '@eslint/config-array@0.23.6'
  - '@expo/cli@58.1.20'
  - '@expo/config-plugins@58.0.13'
  - '@expo/config@58.0.12'
  - '@expo/env@2.6.0'
  - '@expo/fingerprint@0.21.10'
  - '@expo/image-utils@0.12.7'
  - '@expo/inline-modules@0.2.10'
  - '@expo/local-build-cache-provider@58.0.12'
  - '@expo/metro-config@58.0.22'
  - '@expo/metro-file-map@58.0.6'
  - '@expo/plist@0.10.2'
  - '@expo/prebuild-config@58.0.20'
  - '@expo/require-utils@58.0.6'
  - '@expo/router-server@58.0.22'
  - '@typescript-eslint/eslint-plugin@8.72.2'
  - '@typescript-eslint/parser@8.72.2'
