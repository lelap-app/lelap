# Draft of the recipe for F-Droid's fdroiddata repository (metadata/app.lelap.yml), to submit as a
# merge request there once the first stable version is tagged. Kept here so it changes with the
# build. Each release adds a Builds entry; versionCode comes from `scripts/release.mts stamp`.
Categories:
  - Multimedia
License: AGPL-3.0-only
AuthorName: Lelap
WebSite: https://lelap.app
SourceCode: https://github.com/lelap-app/lelap
IssueTracker: https://github.com/lelap-app/lelap/issues
Changelog: https://github.com/lelap-app/lelap/releases

AutoName: Lelap

RepoType: git
Repo: https://github.com/lelap-app/lelap.git
# F-Droid builds the unsigned APK below and, when it matches, publishes our signed one from here.
Binaries: https://github.com/lelap-app/lelap/releases/download/v%v/lelap-%v-fdroid.apk

Builds:
  - versionName: 0.1.0
    versionCode: 10099
    commit: v0.1.0
    subdir: apps/app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
    init:
      - NODE_VERSION=$(cat ../../.nvmrc)
      # Node from nodejs.org with its published checksum, then pnpm through corepack.
      - curl -fsSLO https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz
      - curl -fsSL https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt | grep linux-x64.tar.xz | sha256sum -c -
      - tar xf node-v${NODE_VERSION}-linux-x64.tar.xz
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - export PATH=$PWD/node-v$(cat ../../.nvmrc)-linux-x64/bin:$PATH
      - corepack enable
      - (cd ../.. && pnpm install --frozen-lockfile && node scripts/release.mts stamp v$$VERSION$$)
      - EXPO_PUBLIC_LELAP_DISTRIBUTION=fdroid pnpm exec expo prebuild --platform android --no-install
    scanignore:
      - node_modules
    build:
      - export PATH=$PWD/node-v$(cat ../../.nvmrc)-linux-x64/bin:$PATH
      - cd android
      - EXPO_PUBLIC_LELAP_DISTRIBUTION=fdroid LELAP_UNSIGNED=1 ./gradlew --no-daemon :app:assembleRelease
    ndk: 27.1.12297006

# The SHA-256 of our signing certificate: `apksigner verify --print-certs lelap-x.y.z.apk`.
AllowedAPKSigningKeys: FILL_IN_FROM_THE_RELEASE_KEYSTORE

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 10099
