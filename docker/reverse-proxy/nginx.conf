# Lelap behind nginx. Goes into nginx's http block (for example /etc/nginx/conf.d/lelap.conf).
# Replace example.org with your domain, and point the certificate paths at yours (certbot
# --nginx or certbot certonly for the four names). See README.md in this folder.
# The admin pages (ports 9787 to 9790) are left out on purpose: reach them over SSH instead.

upstream lelap_web {
    server 127.0.0.1:8080;
}
upstream lelap_catalog {
    server 127.0.0.1:8787;
}
upstream lelap_proxy {
    server 127.0.0.1:8788;
}
upstream lelap_sync {
    server 127.0.0.1:8789;
}

# Which service each name goes to; the names match the upstreams above.
map $host $lelap_upstream {
    default "";
    listen.example.org lelap_web;
    catalog.example.org lelap_catalog;
    proxy.example.org lelap_proxy;
    sync.example.org lelap_sync;
}

# Each address gets 20 requests a second with bursts of 40; the web app's feed refreshes fit.
limit_req_zone $binary_remote_addr zone=lelap:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name listen.example.org catalog.example.org proxy.example.org sync.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name listen.example.org catalog.example.org proxy.example.org sync.example.org;

    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    server_tokens off;
    # Devices push up to about 13 MB of sealed sync messages at once.
    client_max_body_size 16m;
    limit_req zone=lelap burst=40 nodelay;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Large feeds and pushes stream through instead of filling a temporary file first.
    proxy_request_buffering off;

    location / {
        # Any other name (scanners, the bare IP address) gets the connection closed.
        if ($lelap_upstream = "") {
            return 444;
        }
        proxy_pass http://$lelap_upstream;
    }
}
