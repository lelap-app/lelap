# Lelap's services for self-hosting: `docker compose up -d` in this folder. Settings come from
# `.env` next to this file (copy .env.example); without one, everything runs with defaults.
# ADMIN_TOKEN and CONFIG_SECRET are made on first start and kept in the `secrets` volume.
# HTTPS on your own domain: `--profile https` adds Caddy in front. See README.md.
name: lelap

x-service: &service
  restart: unless-stopped
  volumes: ['secrets:/secrets']
  # ADMIN_TOKEN empty: the one generated into the secrets volume.
  environment: &environment
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    # true: the admin page answers public addresses too (still with the token).
    ADMIN_ALLOW_REMOTE: ${ADMIN_ALLOW_REMOTE:-false}

services:
  web:
    # Built here for LELAP_DOMAIN: the published web image only knows lelap.app's services.
    image: lelap-web:${LELAP_DOMAIN:-localhost}
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        LELAP_DOMAIN: ${LELAP_DOMAIN:-localhost}
    ports: ['8080:8080']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s

  catalog:
    <<: *service
    image: ghcr.io/lelap-app/catalog:${LELAP_TAG:-latest}
    build: { context: .., dockerfile: docker/catalog.Dockerfile }
    environment:
      <<: *environment
      # Optional: Podcast Index catalogs and podcast search.
      PODCASTINDEX_KEY: ${PODCASTINDEX_KEY:-}
      PODCASTINDEX_SECRET: ${PODCASTINDEX_SECRET:-}
      # Seals listeners' Hardcover and gPodder tokens into their add-on URLs. Generated when
      # empty; keep it (and the secrets volume) stable, or those add-ons need setting up again.
      CONFIG_SECRET: ${CONFIG_SECRET:-}
      # A gPodder server on your own network: true lets the gPodder add-on reach private addresses.
      SCROBBLE_ALLOW_PRIVATE: ${SCROBBLE_ALLOW_PRIVATE:-false}
    ports: ['8787:8787', '${ADMIN_BIND:-127.0.0.1}:9787:9787']

  proxy:
    <<: *service
    image: ghcr.io/lelap-app/proxy:${LELAP_TAG:-latest}
    build: { context: .., dockerfile: docker/proxy.Dockerfile }
    environment:
      <<: *environment
      ALLOW_ORIGIN: ${WEB_ORIGIN:-*}
      # Feeds on your own network: true lets the proxy reach private addresses. Keep it private then.
      PROXY_ALLOW_PRIVATE: ${PROXY_ALLOW_PRIVATE:-false}
    ports: ['8788:8788', '${ADMIN_BIND:-127.0.0.1}:9788:9788']

  sync:
    <<: *service
    image: ghcr.io/lelap-app/sync:${LELAP_TAG:-latest}
    build: { context: .., dockerfile: docker/sync.Dockerfile }
    environment:
      <<: *environment
      # Optional: delete sync groups no device synced with for this many days. Empty or 0: never.
      SYNC_IDLE_EXPIRY_DAYS: ${SYNC_IDLE_EXPIRY_DAYS:-}
    volumes: ['secrets:/secrets', 'sync-data:/data']
    ports: ['8789:8789', '${ADMIN_BIND:-127.0.0.1}:9789:9789']

  # Only for Android builds of your own (README.md): signed bundles from scripts/ota.mts.
  updates:
    <<: *service
    profiles: [updates]
    image: ghcr.io/lelap-app/updates:${LELAP_TAG:-latest}
    build: { context: .., dockerfile: docker/updates.Dockerfile }
    volumes: ['secrets:/secrets', 'updates-data:/data:ro']
    ports: ['8790:8790', '${ADMIN_BIND:-127.0.0.1}:9790:9790']

  # HTTPS for listen., catalog., proxy. and sync.<LELAP_DOMAIN>, with certificates from Let's
  # Encrypt. Needs the four names in DNS and ports 80 and 443 free (reverse-proxy/README.md).
  https:
    profiles: [https]
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      LELAP_DOMAIN: ${LELAP_DOMAIN:-localhost}
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ['80:80', '443:443', '443:443/udp']
    depends_on: [web, catalog, proxy, sync]
    restart: unless-stopped

volumes:
  secrets:
  sync-data:
  updates-data:
  caddy-data:
  caddy-config:
