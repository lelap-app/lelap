version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # astro check and typescript-eslint support TypeScript below 6.1 only.
      - dependency-name: typescript
        versions: ['>=6.1.0']

  - package-ecosystem: docker
    directories: ['/docker']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ['*']
