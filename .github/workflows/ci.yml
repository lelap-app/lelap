name: CI

on:
  pull_request:
  push:
    branches: [main]
  # By hand: the emulator smoke test on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a run on main that finishes saves the caches release builds read.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, lint, check, build
    runs-on: ubuntu-latest
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm roadmap --check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # The release attaches this SBOM (release.yml); a second here, so a tag never finds it broken.
      - run: pnpm --filter @lelap/app sbom --lockfile-only --prod --sbom-format cyclonedx --sbom-type application --out "$RUNNER_TEMP/sbom.json"

  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      apk: ${{ steps.filter.outputs.apk }}
      remote: ${{ steps.filter.outputs.remote }}
      emulator: ${{ steps.filter.outputs.emulator }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'modules/**'
              - 'apps/app/package.json'
              - 'apps/app/app.json'
              - 'apps/app/app.config.js'
              - 'apps/app/plugins/**'
              - 'apps/app/certs/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/unsigned-apk/**'
              - 'scripts/android-sdk.sh'
              - 'scripts/unsigned-apk.sh'
              - 'scripts/release.mts'
              - 'packages/core/src/release.ts'
            # The build setup only: Kotlin and TypeScript changes alone don't run the release build.
            apk:
              - 'apps/app/plugins/**'
              - 'apps/app/app.json'
              - 'apps/app/app.config.js'
              - 'apps/app/package.json'
              - 'apps/app/metro.config.js'
              - 'apps/app/babel.config.js'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'modules/**/*.gradle'
              - 'modules/**/*.gradle.kts'
              - 'modules/**/gradle.properties'
              - 'apps/app/**/*.gradle'
              - 'apps/app/**/*.gradle.kts'
              - 'apps/app/**/gradle.properties'
              - 'scripts/android-sdk.sh'
              - 'scripts/unsigned-apk.sh'
              - 'scripts/release.mts'
              - 'scripts/sign-apks.sh'
              - 'scripts/verify-fdroid-apk.sh'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            # The emulator smoke test's own scripts; it also runs when the build setup changes.
            emulator:
              - 'scripts/emulator-apk.sh'
              - 'scripts/emulator-smoke.sh'
            # The remote code, for the tests against real WebDAV and S3 servers.
            remote:
              - 'packages/core/src/remote/**'
              - 'packages/core/src/library/**'
              - 'packages/core/src/podcasts/xml.ts'
              - 'pnpm-lock.yaml'
              - 'packages/core/integration/**'
              - 'packages/core/vitest.integration.config.ts'
              - 'scripts/test-servers.sh'
              - '.github/workflows/ci.yml'

  android-unit-tests:
    name: Android unit tests
    needs: changes
    # Runs on every push to main (which also warms the Gradle cache) and on pull requests that touch
    # native code. A skipped job counts as passing for required checks, so other PRs still merge.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: bash scripts/android-sdk.sh
      # The Android project is generated, not committed.
      - run: pnpm --filter @lelap/app exec expo prebuild --platform android --no-install
      - run: ./gradlew :lelap-audio:testDebugUnitTest :lelap-cast:testDebugUnitTest :lelap-library:testDebugUnitTest :lelap-download:testDebugUnitTest :lelap-updater:testDebugUnitTest :lelap-widget:testDebugUnitTest :lelap-bluetooth:testDebugUnitTest :lelap-text:testDebugUnitTest :lelap-netfs:testDebugUnitTest
        working-directory: apps/app/android
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: modules/*/android/build/reports/tests/
          retention-days: 7

  apk:
    name: Unsigned release APK
    needs: changes
    # The release build the tag workflow runs, for one CPU type. On main it also saves the pnpm and
    # Gradle caches the release workflow reads; nothing else writes them (M54). On pull requests
    # that change the build setup it only checks that the build still works.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.apk == 'true') }}
    runs-on: ubuntu-latest
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: apk
        uses: ./.github/actions/unsigned-apk
        with:
          distribution: direct
          abi: arm64-v8a
          tag: v0.0.0
          domain: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
      - name: Size
        env:
          NAME: ${{ steps.apk.outputs.name }}
        run: ls -l "out/$NAME"
      # To try the build on a phone without a release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: out/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.apk.outputs.pnpm-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apk.outputs.pnpm-store }}
          key: ${{ steps.apk.outputs.pnpm-key }}
      # The same paths as the restore step in .github/actions/unsigned-apk.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.apk.outputs.gradle-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
            ~/.gradle/wrapper/dists
          key: ${{ steps.apk.outputs.gradle-key }}

  remote-integration:
    name: Remote code against real servers
    needs: changes
    # rclone's WebDAV server and MinIO in Docker, started by the same script as on a laptop: both
    # images need a command, which service containers can't take. On main and on pull requests
    # that touch the remote code.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.remote == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/test-servers.sh up
      - run: pnpm test:integration
      - if: failure()
        run: |
          docker logs lelap-test-webdav
          docker logs lelap-test-s3

  emulator-smoke:
    name: App on an emulator
    needs: changes
    # An x86_64 release build on an x86_64 emulator: the arm64 APK can't run there, since its
    # native libraries stay inside the APK (M54) and Android looks there only for the emulator's
    # own CPU type. Next to the apk job and under the same rules (main, and pull requests that
    # change the build setup), plus runs by hand and changes to its scripts; other pull requests
    # stay fast. It reads the caches the apk job saves on main and never writes them.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.apk == 'true' || needs.changes.outputs.emulator == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      # The same keys and paths as .github/actions/unsigned-apk, so it finds the apk job's caches.
      - id: keys
        env:
          LOCK: ${{ hashFiles('pnpm-lock.yaml') }}
          GRADLE: ${{ hashFiles('pnpm-lock.yaml', 'modules/*/android/build.gradle', 'apps/app/plugins/**') }}
        run: |
          {
            echo "pnpm=apk-pnpm-$RUNNER_OS-$LOCK"
            echo "gradle=apk-gradle-$RUNNER_OS-$GRADLE"
            echo "store=$(pnpm store path --silent)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.store }}
          key: ${{ steps.keys.outputs.pnpm }}
          restore-keys: apk-pnpm-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
            ~/.gradle/wrapper/dists
          key: ${{ steps.keys.outputs.gradle }}
          restore-keys: apk-gradle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/android-sdk.sh
      - env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
        run: bash scripts/emulator-apk.sh apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A second try on the same emulator before the job fails: a first boot is sometimes slow. A
      # pass on the second try leaves a warning, so a crash now and then still shows.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/emulator-smoke.sh apk/lelap-emulator.apk smoke || { echo '::warning::The first try failed; see smoke/ in the emulator-smoke artifact.' && bash scripts/emulator-smoke.sh apk/lelap-emulator.apk smoke-retry; }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-smoke
          path: smoke*/
          if-no-files-found: ignore
          retention-days: 7
