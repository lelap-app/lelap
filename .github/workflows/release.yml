name: Release

# Runs on version tags: v1.2.3 (stable) and v1.2.3-beta.4 (beta). Signing and publishing run in
# the `release` environment, which only tags can use and which needs a reviewer's approval.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'

jobs:
  verify:
    name: Format, lint, check, test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # F-Droid's update check reads the version from app.json at a stable tag.
      - run: node scripts/release.mts committed "$GITHUB_REF_NAME"
      - id: version
        run: node scripts/release.mts stamp "$GITHUB_REF_NAME"
      - run: git checkout apps/app/app.json
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  # Unsigned APKs, one per distribution and CPU type, in parallel. No environment and no
  # secrets, so this job may read the pnpm and Gradle caches that runs on `main` wrote (it never
  # writes them). The signing jobs below check every APK against the SHA-256 reported here.
  build:
    name: Unsigned APK (${{ matrix.distribution }}, ${{ matrix.abi }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        distribution: [direct, fdroid]
        abi: [arm64-v8a, armeabi-v7a]
    # Outputs of all four legs are combined; each leg sets only its own names.
    outputs:
      runtime-arm64-v8a: ${{ steps.report.outputs.runtime-arm64-v8a }}
      runtime-armeabi-v7a: ${{ steps.report.outputs.runtime-armeabi-v7a }}
      direct-arm64-v8a: ${{ steps.report.outputs.direct-arm64-v8a }}
      direct-armeabi-v7a: ${{ steps.report.outputs.direct-armeabi-v7a }}
      fdroid-arm64-v8a: ${{ steps.report.outputs.fdroid-arm64-v8a }}
      fdroid-armeabi-v7a: ${{ steps.report.outputs.fdroid-armeabi-v7a }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: apk
        uses: ./.github/actions/unsigned-apk
        with:
          distribution: ${{ matrix.distribution }}
          abi: ${{ matrix.abi }}
          tag: ${{ github.ref_name }}
          domain: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
      - id: report
        name: Report the SHA-256
        env:
          LEG: ${{ matrix.distribution }}-${{ matrix.abi }}
          DISTRIBUTION: ${{ matrix.distribution }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          NAME: ${{ steps.apk.outputs.name }}
          ABI: ${{ matrix.abi }}
          RUNTIME: ${{ steps.apk.outputs.runtime }}
        run: |
          echo "$LEG=$SHA256  $NAME" >> "$GITHUB_OUTPUT"
          if [ "$DISTRIBUTION" = direct ]; then echo "runtime-$ABI=$RUNTIME" >> "$GITHUB_OUTPUT"; fi
          echo "$SHA256  $NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.distribution }}-${{ matrix.abi }}
          path: out/*.apk
          if-no-files-found: error
          # As long as the signed ones: the approval may come days after the tag.
          retention-days: 7
      # The Gradle libraries inside the APK, for the SBOM. One leg is enough: every APK has the
      # same libraries, only the native code's CPU type differs.
      - name: Gradle libraries
        if: matrix.distribution == 'direct' && matrix.abi == 'arm64-v8a'
        working-directory: apps/app/android
        run: |
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath \
            > "$RUNNER_TEMP/gradle-dependencies.txt"
      - if: matrix.distribution == 'direct' && matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-dependencies
          path: ${{ runner.temp }}/gradle-dependencies.txt
          if-no-files-found: error
          retention-days: 7

  # A software bill of materials: the app's npm packages (APK and web app) from the lockfile and
  # the Gradle libraries in the APK, in CycloneDX. No environment and no secrets; `publish`
  # attaches it to the GitHub release. The Docker images carry their own, made by BuildKit
  # (`sbom: true` below).
  sbom:
    name: Software bill of materials
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Reads the lockfile only: nothing to install, nothing to cache.
          package-manager-cache: false
      - name: Write the SBOM
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p sbom
          pnpm --filter @lelap/app sbom --lockfile-only --prod --sbom-format cyclonedx \
            --sbom-type application --out "sbom/lelap-$VERSION-sbom.cdx.json"
          # Refuse an empty or foreign file rather than attach it.
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "sbom/lelap-$VERSION-sbom.cdx.json" > /dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gradle-dependencies
          path: ${{ runner.temp }}
      - name: Add the Gradle libraries
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/gradle-sbom.mts "$RUNNER_TEMP/gradle-dependencies.txt" "sbom/lelap-$VERSION-sbom.cdx.json"
          jq '.components | length' "sbom/lelap-$VERSION-sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error
          retention-days: 7

  # Signs the two direct APKs. Holds the keystore, so it uses no cache and installs no packages:
  # it only checks the SHA-256 the build job reported, checks alignment and signs.
  apk:
    name: Signed APK
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: release
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
      ota: ${{ steps.ota.outputs.ota }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ota
        name: Over-the-air updates
        run: |
          # Without a committed certificate the app has updates turned off; nothing to publish.
          if [ -f apps/app/certs/certificate.pem ]; then echo "ota=true" >> "$GITHUB_OUTPUT"; fi
      - id: runtime
        name: One runtime for both direct APKs
        env:
          ARM64: ${{ needs.build.outputs['runtime-arm64-v8a'] }}
          ARMV7: ${{ needs.build.outputs['runtime-armeabi-v7a'] }}
        run: |
          # The over-the-air bundle is built for one runtime; both APKs must report it.
          if [ -z "$ARM64" ] || [ "$ARM64" != "$ARMV7" ]; then
            echo "::error::The direct APKs report different runtimes: '$ARM64' and '$ARMV7'"
            exit 1
          fi
          echo "runtime=$ARM64" >> "$GITHUB_OUTPUT"
      - name: Build tools for signing
        run: bash scripts/sign-apks.sh --install-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-direct-*
          merge-multiple: true
          path: unsigned
      - name: Check and sign
        env:
          ARM64: ${{ needs.build.outputs['direct-arm64-v8a'] }}
          ARMV7: ${{ needs.build.outputs['direct-armeabi-v7a'] }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LELAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LELAP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LELAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s\n' "$ARM64" "$ARMV7" > "$RUNNER_TEMP/expected.sha256"
          export LELAP_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          # Removed however the job ends, not only when it succeeds.
          trap 'rm -f "$LELAP_KEYSTORE_PATH"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LELAP_KEYSTORE_PATH")
          bash scripts/sign-apks.sh "$RUNNER_TEMP/expected.sha256" unsigned out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-direct
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

  # The same commit without self-updates, for F-Droid: its build server rebuilds each of these
  # APKs from source and, when the bytes match, ships it with our signature
  # (docs/milestones/m28.md, docs/milestones/m54.md).
  apk-fdroid:
    name: Signed APK for F-Droid
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools for signing
        run: bash scripts/sign-apks.sh --install-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-fdroid-*
          merge-multiple: true
          path: unsigned
      - name: Check and sign
        env:
          ARM64: ${{ needs.build.outputs['fdroid-arm64-v8a'] }}
          ARMV7: ${{ needs.build.outputs['fdroid-armeabi-v7a'] }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LELAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LELAP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LELAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s\n' "$ARM64" "$ARMV7" > "$RUNNER_TEMP/expected.sha256"
          export LELAP_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$LELAP_KEYSTORE_PATH"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LELAP_KEYSTORE_PATH")
          bash scripts/sign-apks.sh "$RUNNER_TEMP/expected.sha256" unsigned out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-fdroid
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to R2 and GitHub Releases
    # After the over-the-air job, whose result decides whether the APK is an update (see the
    # step `Is the APK an update?`). It also runs when that job fails or is skipped.
    needs: [verify, sbom, apk, apk-fdroid, ota]
    if: ${{ !cancelled() && needs.sbom.result == 'success' && needs.apk.result == 'success' && needs.apk-fdroid.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No shared caches in jobs that hold release secrets.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apk-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: out
      - name: Checksums
        working-directory: out
        run: sha256sum -- *.apk *-sbom.cdx.json | tee SHA256SUMS
      - name: Write the release file
        env:
          CHANNEL: ${{ needs.verify.outputs.channel }}
          DOWNLOADS: ${{ vars.DOWNLOADS_BASE }}
          RUNTIME: ${{ needs.apk.outputs.runtime }}
        run: |
          node scripts/release.mts info "$GITHUB_REF_NAME" out "$DOWNLOADS" "$RUNTIME" > out/release.json
          if [ "$CHANNEL" = stable ]; then echo latest > out/name; else echo beta > out/name; fi
          cat out/release.json
      # A JavaScript-only release reaches apps of the same runtime over the air; offering its APK
      # as well would make them download an APK of about 40 MB for the same code (M70).
      - id: update
        name: Is the APK an update?
        env:
          DOWNLOADS: ${{ vars.DOWNLOADS_BASE }}
          RUNTIME: ${{ needs.apk.outputs.runtime }}
          OTA: ${{ needs.ota.result == 'success' }}
        run: |
          # No file yet, or the host is unreachable: compare with nothing, which publishes.
          curl -fsS --retry 3 "$DOWNLOADS/$(cat out/name).json" -o "$RUNNER_TEMP/previous.json" || true
          node scripts/release.mts apk-update "$RUNNER_TEMP/previous.json" "$RUNTIME" "$OTA"
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.verify.outputs.version }}
          APK_UPDATE: ${{ steps.update.outputs.apk }}
        working-directory: services/sync
        run: |
          # The direct APKs: arm64 under the plain name, 32-bit ARM with `-armv7`.
          for suffix in "" -armv7; do
            pnpm exec wrangler r2 object put "lelap-downloads/apk/lelap-$VERSION$suffix.apk" --remote \
              --file "../../out/lelap-$VERSION$suffix.apk" --content-type application/vnd.android.package-archive
          done
          # Fixed names for the landing page's download buttons: beta.apk always (a stable release
          # is the newest beta too), latest.apk for stable releases, each with an -armv7 sibling.
          names=(beta)
          if [ "$(cat ../../out/name)" = latest ]; then names=(latest beta); fi
          for name in "${names[@]}"; do
            for suffix in "" -armv7; do
              pnpm exec wrangler r2 object put "lelap-downloads/$name$suffix.apk" --remote \
                --file "../../out/lelap-$VERSION$suffix.apk" --content-type application/vnd.android.package-archive \
                --content-disposition "attachment; filename=\"lelap-$VERSION$suffix.apk\"" --cache-control no-cache
            done
          done
          # The release file goes last, so it never points at an APK that is not there yet.
          if [ "$APK_UPDATE" != true ]; then
            echo "::notice::Same runtime as the published $(cat ../../out/name).json and the bundle went out over the air: the APK is not offered as an update."
            exit 0
          fi
          pnpm exec wrangler r2 object put "lelap-downloads/$(cat ../../out/name).json" --remote \
            --file ../../out/release.json --content-type application/json --cache-control no-cache
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          flags=()
          if [ "$CHANNEL" = beta ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "out/lelap-$VERSION.apk" "out/lelap-$VERSION-armv7.apk" \
            "out/lelap-$VERSION-fdroid.apk" "out/lelap-$VERSION-fdroid-armv7.apk" out/SHA256SUMS out/release.json \
            "out/lelap-$VERSION-sbom.cdx.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Lelap $VERSION" "${flags[@]}"

  ota:
    name: Over-the-air update
    needs: [verify, apk]
    if: needs.apk.outputs.ota == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No shared caches in jobs that hold release secrets.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mts stamp "$GITHUB_REF_NAME"
      - run: pnpm --filter @lelap/app exec expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
      - name: Export the bundle
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
          APK_RUNTIME: ${{ needs.apk.outputs.runtime }}
        working-directory: apps/app
        run: |
          runtime="$(pnpm --silent exec expo-updates runtimeversion:resolve --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runtimeVersion))')"
          # A bundle for another native build would crash on start: refuse rather than publish.
          if [ "$runtime" != "$APK_RUNTIME" ]; then
            echo "::error::Runtime $runtime differs from the APK's $APK_RUNTIME"
            exit 1
          fi
          pnpm exec expo export --platform android --output-dir dist-ota
          pnpm --silent exec expo config --type public --json > dist-ota/expo-config.json
      - name: Sign the manifest
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          RUNTIME: ${{ needs.apk.outputs.runtime }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          DOWNLOADS: ${{ vars.DOWNLOADS_BASE }}
        run: |
          # The commit's time, not now: a fresh install of this APK (built later) skips the
          # bundle it already carries, while older APKs of the same runtime take it.
          created="$(git log -1 --format=%cI)"
          # Stable releases also reach beta testers, whose channel would otherwise lag behind.
          channels=(beta)
          if [ "$CHANNEL" = stable ]; then channels=(production beta); fi
          for channel in "${channels[@]}"; do
            node scripts/ota.mts apps/app/dist-ota apps/app/dist-ota/expo-config.json \
              "$RUNTIME" "$DOWNLOADS" "$created" "$channel" out-ota
          done
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/updates
        run: |
          root=../../out-ota
          type_of() {
            case "${1##*.}" in
              bundle) echo application/javascript ;;
              png) echo image/png ;;
              jpg | jpeg) echo image/jpeg ;;
              gif) echo image/gif ;;
              webp) echo image/webp ;;
              svg) echo image/svg+xml ;;
              ttf) echo font/ttf ;;
              otf) echo font/otf ;;
              woff) echo font/woff ;;
              woff2) echo font/woff2 ;;
              json) echo application/json ;;
              *) echo application/octet-stream ;;
            esac
          }
          # Bundle and assets first; the manifests last, so they never name a missing file.
          find "$root/ota" -type f -not -path "*/ota/channels/*" | while read -r file; do
            pnpm exec wrangler r2 object put "lelap-downloads/${file#"$root/"}" --remote --file "$file" \
              --content-type "$(type_of "$file")" --cache-control "public, max-age=31536000, immutable"
          done
          find "$root/ota/channels" -type f | while read -r file; do
            pnpm exec wrangler r2 object put "lelap-downloads/${file#"$root/"}" --remote --file "$file" \
              --content-type application/json --cache-control no-cache
          done

  images:
    name: Docker image (${{ matrix.service }})
    # After the APK job, so images (and `latest`) wait for the release reviewer's approval too.
    needs: [verify, apk]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, catalog, proxy, sync, updates]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.channel == 'stable' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.channel == 'stable' }}
            type=raw,value=beta,enable=${{ needs.verify.outputs.channel == 'beta' }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM attestation next to each image, listing its Alpine and Node packages too.
          sbom: true
          build-args: |
            LELAP_DOMAIN=${{ vars.LELAP_DOMAIN || 'lelap.app' }}
            LELAP_ANDROID_CERT_SHA256=${{ vars.LELAP_ANDROID_CERT_SHA256 }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Beta tags too: beta testers' apps use the production sync server, so it must exist before
  # the first stable release.
  sync:
    name: Deploy sync to production
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No shared caches in jobs that hold release secrets.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/sync
          command: d1 migrations apply lelap-sync --remote
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/sync
          # Idle expiry comes from the environment like the domain: lelap.app sets 730 days in
          # `release`; unset means groups never expire (M52).
          command: >-
            deploy ${{ vars.SYNC_DOMAIN && format('--domain {0}', vars.SYNC_DOMAIN) || '' }}
            ${{ vars.SYNC_IDLE_EXPIRY_DAYS && format('--var SYNC_IDLE_EXPIRY_DAYS:{0}', vars.SYNC_IDLE_EXPIRY_DAYS) || '' }}
