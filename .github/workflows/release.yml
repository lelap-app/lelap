name: Release

# Runs on version tags: v1.2.3 (stable) and v1.2.3-beta.4 (beta). Signing and publishing run in
# the `release` environment, which only tags can use and which needs a reviewer's approval.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'

jobs:
  verify:
    name: Format, lint, check, test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: node scripts/release.mts stamp "$GITHUB_REF_NAME"
      - run: git checkout apps/app/app.json
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  apk:
    name: Signed APK
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
      ota: ${{ steps.runtime.outputs.ota }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No shared caches in jobs that hold release secrets.
          package-manager-cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mts stamp "$GITHUB_REF_NAME"
      - run: pnpm --filter @lelap/app exec expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
      # The native fingerprint this APK is built with; the `ota` job publishes bundles for it.
      - id: runtime
        name: Runtime version
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
        run: |
          runtime="$(pnpm --silent --filter @lelap/app exec expo-updates runtimeversion:resolve --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runtimeVersion))')"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          # Without a committed certificate the app has updates turned off; nothing to publish.
          if [ -f apps/app/certs/certificate.pem ]; then echo "ota=true" >> "$GITHUB_OUTPUT"; fi
          echo "Runtime version: $runtime"
      - name: Build and sign
        working-directory: apps/app/android
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LELAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LELAP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LELAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export LELAP_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          # Removed however the build ends, not only when it succeeds.
          trap 'rm -f "$LELAP_KEYSTORE_PATH"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LELAP_KEYSTORE_PATH")
          ./gradlew :app:assembleRelease
      - name: Name the APK
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p out
          cp apps/app/android/app/build/outputs/apk/release/app-release.apk "out/lelap-$VERSION.apk"
      # The same commit without self-updates, for F-Droid: its build server rebuilds this APK from
      # source and, when the bytes match, ships it with our signature (docs/milestones/m28.md).
      - name: Prebuild for F-Droid
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
          EXPO_PUBLIC_LELAP_DISTRIBUTION: fdroid
        run: pnpm --filter @lelap/app exec expo prebuild --platform android --no-install --clean
      - name: Build and sign for F-Droid
        working-directory: apps/app/android
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
          EXPO_PUBLIC_LELAP_DISTRIBUTION: fdroid
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LELAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LELAP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LELAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          export LELAP_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$LELAP_KEYSTORE_PATH"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LELAP_KEYSTORE_PATH")
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../../../out/lelap-$VERSION-fdroid.apk"
      - name: Checksums
        working-directory: out
        run: sha256sum *.apk | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            out/*.apk
            out/SHA256SUMS
          retention-days: 7

  publish:
    name: Publish to R2 and GitHub Releases
    needs: [verify, apk]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No shared caches in jobs that hold release secrets.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: out
      - name: Write the release file
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          DOWNLOADS: ${{ vars.DOWNLOADS_BASE }}
        run: |
          apk="out/lelap-$VERSION.apk"
          node scripts/release.mts info "$GITHUB_REF_NAME" "$apk" "$DOWNLOADS/apk/lelap-$VERSION.apk" > out/release.json
          if [ "$CHANNEL" = stable ]; then echo latest > out/name; else echo beta > out/name; fi
          cat out/release.json
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.verify.outputs.version }}
        working-directory: services/sync
        run: |
          pnpm exec wrangler r2 object put "lelap-downloads/apk/lelap-$VERSION.apk" --remote \
            --file "../../out/lelap-$VERSION.apk" --content-type application/vnd.android.package-archive
          # Fixed names for the landing page's download buttons: beta.apk always (a stable release
          # is the newest beta too), latest.apk for stable releases.
          names=(beta)
          if [ "$(cat ../../out/name)" = latest ]; then names=(latest beta); fi
          for name in "${names[@]}"; do
            pnpm exec wrangler r2 object put "lelap-downloads/$name.apk" --remote \
              --file "../../out/lelap-$VERSION.apk" --content-type application/vnd.android.package-archive \
              --content-disposition "attachment; filename=\"lelap-$VERSION.apk\"" --cache-control no-cache
          done
          # The release file goes last, so it never points at an APK that is not there yet.
          pnpm exec wrangler r2 object put "lelap-downloads/$(cat ../../out/name).json" --remote \
            --file ../../out/release.json --content-type application/json --cache-control no-cache
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          flags=()
          if [ "$CHANNEL" = beta ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "out/lelap-$VERSION.apk" \
            "out/lelap-$VERSION-fdroid.apk" out/SHA256SUMS out/release.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Lelap $VERSION" "${flags[@]}"

  ota:
    name: Over-the-air update
    needs: [verify, apk]
    if: needs.apk.outputs.ota == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No shared caches in jobs that hold release secrets.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mts stamp "$GITHUB_REF_NAME"
      - run: pnpm --filter @lelap/app exec expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
      - name: Export the bundle
        env:
          EXPO_PUBLIC_LELAP_DOMAIN: ${{ vars.LELAP_DOMAIN || 'lelap.app' }}
          APK_RUNTIME: ${{ needs.apk.outputs.runtime }}
        working-directory: apps/app
        run: |
          runtime="$(pnpm --silent exec expo-updates runtimeversion:resolve --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runtimeVersion))')"
          # A bundle for another native build would crash on start: refuse rather than publish.
          if [ "$runtime" != "$APK_RUNTIME" ]; then
            echo "::error::Runtime $runtime differs from the APK's $APK_RUNTIME"
            exit 1
          fi
          pnpm exec expo export --platform android --output-dir dist-ota
          pnpm --silent exec expo config --type public --json > dist-ota/expo-config.json
      - name: Sign the manifest
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          RUNTIME: ${{ needs.apk.outputs.runtime }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          DOWNLOADS: ${{ vars.DOWNLOADS_BASE }}
        run: |
          # The commit's time, not now: a fresh install of this APK (built later) skips the
          # bundle it already carries, while older APKs of the same runtime take it.
          created="$(git log -1 --format=%cI)"
          # Stable releases also reach beta testers, whose channel would otherwise lag behind.
          channels=(beta)
          if [ "$CHANNEL" = stable ]; then channels=(production beta); fi
          for channel in "${channels[@]}"; do
            node scripts/ota.mts apps/app/dist-ota apps/app/dist-ota/expo-config.json \
              "$RUNTIME" "$DOWNLOADS" "$created" "$channel" out-ota
          done
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: services/updates
        run: |
          root=../../out-ota
          type_of() {
            case "${1##*.}" in
              bundle) echo application/javascript ;;
              png) echo image/png ;;
              jpg | jpeg) echo image/jpeg ;;
              gif) echo image/gif ;;
              webp) echo image/webp ;;
              svg) echo image/svg+xml ;;
              ttf) echo font/ttf ;;
              otf) echo font/otf ;;
              woff) echo font/woff ;;
              woff2) echo font/woff2 ;;
              json) echo application/json ;;
              *) echo application/octet-stream ;;
            esac
          }
          # Bundle and assets first; the manifests last, so they never name a missing file.
          find "$root/ota" -type f -not -path "*/ota/channels/*" | while read -r file; do
            pnpm exec wrangler r2 object put "lelap-downloads/${file#"$root/"}" --remote --file "$file" \
              --content-type "$(type_of "$file")" --cache-control "public, max-age=31536000, immutable"
          done
          find "$root/ota/channels" -type f | while read -r file; do
            pnpm exec wrangler r2 object put "lelap-downloads/${file#"$root/"}" --remote --file "$file" \
              --content-type application/json --cache-control no-cache
          done

  images:
    name: Docker image (${{ matrix.service }})
    # After the APK job, so images (and `latest`) wait for the release reviewer's approval too.
    needs: [verify, apk]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, catalog, proxy, sync, updates]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.channel == 'stable' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.channel == 'stable' }}
            type=raw,value=beta,enable=${{ needs.verify.outputs.channel == 'beta' }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LELAP_DOMAIN=${{ vars.LELAP_DOMAIN || 'lelap.app' }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  sync:
    name: Deploy sync to production
    needs: verify
    if: needs.verify.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No shared caches in jobs that hold release secrets.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/sync
          command: d1 migrations apply lelap-sync --remote
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/sync
          command: deploy ${{ vars.SYNC_DOMAIN && format('--domain {0}', vars.SYNC_DOMAIN) || '' }}
