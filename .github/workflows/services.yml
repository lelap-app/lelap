name: Deploy services

on:
  push:
    branches: [main]
    paths:
      - services/catalog/**
      - packages/sdk/**
      - pnpm-lock.yaml
      - .github/workflows/services.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-services
  cancel-in-progress: false

jobs:
  test:
    name: Test catalog
    runs-on: ubuntu-latest
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lelap/catalog check
      - run: pnpm --filter @lelap/catalog test

  deploy:
    name: Deploy catalog to Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    # The `web` environment only allows main and holds the Workers-scoped token.
    environment:
      name: web
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/catalog
          # The custom domain comes from the environment, so forks deploy to their own.
          command: deploy ${{ vars.CATALOG_DOMAIN && format('--domain {0}', vars.CATALOG_DOMAIN) || '' }}
