name: Deploy services

on:
  push:
    branches: [main]
    paths:
      - services/catalog/**
      - services/proxy/**
      - services/sync/**
      - services/updates/**
      - packages/core/**
      - packages/sdk/**
      - pnpm-lock.yaml
      - .github/workflows/services.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-services
  cancel-in-progress: false

jobs:
  test:
    name: Test services
    runs-on: ubuntu-latest
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lelap/catalog check
      - run: pnpm --filter @lelap/catalog test
      - run: pnpm --filter @lelap/proxy check
      - run: pnpm --filter @lelap/proxy test
      - run: pnpm --filter @lelap/sync check
      - run: pnpm --filter @lelap/sync test
      - run: pnpm --filter @lelap/updates check
      - run: pnpm --filter @lelap/updates test

  deploy:
    name: Deploy catalog to Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    # The `web` environment only allows main and holds the Workers-scoped token.
    environment:
      name: web
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/catalog
          # The custom domain comes from the environment, so forks deploy to their own.
          command: deploy ${{ vars.CATALOG_DOMAIN && format('--domain {0}', vars.CATALOG_DOMAIN) || '' }}

  deploy-proxy:
    name: Deploy proxy to Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: web
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/proxy
          # Domain and allowed origin come from the environment, so forks deploy to their own.
          command: >-
            deploy ${{ vars.PROXY_DOMAIN && format('--domain {0}', vars.PROXY_DOMAIN) || '' }}
            ${{ vars.WEB_ORIGIN && format('--var ALLOW_ORIGIN:{0}', vars.WEB_ORIGIN) || '' }}

  # Over-the-air bundles: reads what the release workflow signs and uploads; holds no secret.
  deploy-updates:
    name: Deploy updates to Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: web
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/updates
          # The custom domain comes from the environment, so forks deploy to their own.
          command: deploy ${{ vars.UPDATES_DOMAIN && format('--domain {0}', vars.UPDATES_DOMAIN) || '' }}

  # The first service with user data: main deploys to staging, `v*` tags to production (M8).
  deploy-sync-staging:
    name: Deploy sync to staging
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: web
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/sync
          command: d1 migrations apply lelap-sync-staging --remote --env staging
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/sync
          # Unset idle expiry means groups never expire (M52).
          command: >-
            deploy --env staging
            ${{ vars.SYNC_STAGING_DOMAIN && format('--domain {0}', vars.SYNC_STAGING_DOMAIN) || '' }}
            ${{ vars.SYNC_STAGING_IDLE_EXPIRY_DAYS && format('--var SYNC_IDLE_EXPIRY_DAYS:{0}', vars.SYNC_STAGING_IDLE_EXPIRY_DAYS) || '' }}
