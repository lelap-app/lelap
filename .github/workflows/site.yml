name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      # The /changelog page is built from it.
      - CHANGELOG.md
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lelap/site build
        env:
          # Repository variables, so going to beta or release needs no code change.
          PUBLIC_LELAP_RELEASED: ${{ vars.LELAP_RELEASED }}
          PUBLIC_LELAP_BETA: ${{ vars.LELAP_BETA }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/site/dist
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # The `web` environment only allows main and holds the Cloudflare token.
    environment:
      name: web
      url: https://lelap.app
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lelap-site --branch=main --commit-hash=${{ github.sha }}
