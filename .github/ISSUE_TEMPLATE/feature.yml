name: Feature idea
description: Suggest something Lelap should do.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the listening situation or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: markdown
    attributes:
      value: Check docs/roadmap.md first; many ideas are already planned.
