plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lelap.netfs'
version = '0.0.0'

def media3Version = '1.11.1'
// One Bouncy Castle for both libraries: smbj and sshj each ask for a slightly different one.
def bcVersion = '1.86'

android {
  namespace 'app.lelap.netfs'
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
    // Shipped to the app's R8 run: what smbj, sshj and Bouncy Castle reach by reflection.
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // The profile's language for download errors (modules/text).
  implementation project(':lelap-text')
  implementation "androidx.media3:media3-datasource:$media3Version"
  // SMB 2 and 3 (Apache-2.0) and SSH with SFTP (Apache-2.0), both from Maven Central.
  implementation 'com.hierynomus:smbj:0.15.0'
  implementation 'com.hierynomus:sshj:0.41.2'
  implementation "org.bouncycastle:bcprov-jdk18on:$bcVersion"
  implementation "org.bouncycastle:bcpkix-jdk18on:$bcVersion"
  implementation "org.bouncycastle:bcutil-jdk18on:$bcVersion"
  implementation 'org.slf4j:slf4j-api:2.0.18'
  // The add-on sandbox's fetch (AddonFetch): React Native's own OkHttp, so no second copy.
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub in JVM unit tests.
  testImplementation 'org.json:json:20240303'
  // An SFTP server inside the test run, for listing, range reads and host keys.
  testImplementation 'org.apache.sshd:sshd-sftp:2.20.1'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.2'
}
