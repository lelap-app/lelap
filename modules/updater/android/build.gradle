plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lelap.updater'
version = '0.0.0'

android {
  namespace 'app.lelap.updater'
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
}

dependencies {
  // The profile's language for update errors (modules/text).
  implementation project(':lelap-text')
  testImplementation 'junit:junit:4.13.2'
}
