plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lelap.cast'
version = '0.0.0'

android {
  namespace 'app.lelap.cast'
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
}

// No Google Cast SDK and no Play services: the protocols are spoken here, so the one build also
// suits F-Droid.
dependencies {
  // Files on SMB and SFTP servers (M62).
  implementation project(':lelap-netfs')
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub in JVM unit tests.
  testImplementation 'org.json:json:20240303'
}
