plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lelap.audio'
version = '0.0.0'

def media3Version = '1.11.1'

android {
  namespace 'app.lelap.audio'
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
}

dependencies {
  // The profile's language for notifications (modules/text).
  implementation project(':lelap-text')
  // Casting (M50): the session plays through the cast module's link while a receiver plays.
  implementation project(':lelap-cast')
  // SMB and SFTP files (M62): a data source of their own, with the login as headers.
  implementation project(':lelap-netfs')
  // Places and located addresses with the app closed (M123): the app's server tasks.
  implementation project(':lelap-headless')
  implementation "androidx.media3:media3-exoplayer:$media3Version"
  implementation "androidx.media3:media3-session:$media3Version"
  implementation "androidx.media3:media3-datasource:$media3Version"
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub in JVM unit tests.
  testImplementation 'org.json:json:20240303'
}
