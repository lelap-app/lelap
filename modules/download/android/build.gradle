plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lelap.download'
version = '0.0.0'

android {
  namespace 'app.lelap.download'
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
    // Shipped to the app's R8 run: keeps what WorkManager reaches by reflection.
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // Files on SMB and SFTP servers (M62).
  implementation project(':lelap-netfs')
  // The profile's language for notifications (modules/text).
  implementation project(':lelap-text')
  implementation 'androidx.work:work-runtime-ktx:2.10.1'
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub in JVM unit tests.
  testImplementation 'org.json:json:20240303'
}
